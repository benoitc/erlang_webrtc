<!doctype html>
<html>
<head><meta charset="utf-8"><title>Data channel</title></head>
<body>
<input id="text" value="hi"> <button id="send" disabled>Send</button>
<pre id="log"></pre>
<script type="module">
const log = (line) => { document.getElementById('log').textContent += line + '\n'; console.log(line); };

const pc = new RTCPeerConnection();
const channel = pc.createDataChannel('chat');
channel.onopen = () => {
  log('open');
  document.getElementById('send').disabled = false;
  channel.send('hello from the browser');
};
channel.onmessage = (e) => log('erlang: ' + e.data);
channel.onclose = () => log('closed');
document.getElementById('send').onclick = () => channel.send(document.getElementById('text').value);

// An offer with every candidate in it: one request, no trickling.
await pc.setLocalDescription(await pc.createOffer());
if (pc.iceGatheringState !== 'complete') {
  await new Promise((done) => {
    pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') done(); };
  });
}
const res = await fetch('/offer', { method: 'POST', body: pc.localDescription.sdp });
await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
</script>
</body>
</html>
